services:
  # 1. FastAPI Backend (Docker Web Service)
  - type: web
    name: decisionforge-backend
    runtime: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false  # User provides Neon or Render database URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: BACKEND_CORS_ORIGINS
        value: "*"  # Safe CORS wildcard origin handled in main.py
      - key: OPENAI_API_KEY
        value: mock-key

  # 2. React Frontend (Vite Static Site)
  - type: web
    name: decisionforge-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # User provides the backend public URL (e.g., https://decisionforge-backend.onrender.com)
